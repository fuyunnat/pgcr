name: Package PGCR v0.4.1 Full SD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/package-pgcr-v041-full.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified v0.4.1 probe patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download pgcr-v0.4.1-probe-fix \
            --pattern 'PGCR-P0915-v0.4.1-PROBE-FIX.zip' \
            --dir patch

      - name: Assemble v0.4.1 complete SD
        run: |
          set -e
          rm -rf full
          mkdir full
          unzip -q downloads/PGCR-P0915-FULL-SD-v0.4.zip -d full
          unzip -o patch/PGCR-P0915-v0.4.1-PROBE-FIX.zip -d full

          test -f full/metainfo2.txt
          test -f full/Toolbox/GEM/mqb-main.esd
          test -f full/Toolbox/GEM/mqb-pgcrDisplay.esd
          test -f full/Toolbox/apps/pgcr/pgcr-screen-probe

          strings full/Toolbox/apps/pgcr/pgcr-screen-probe | grep 'v0.4.1 CarPlay Source Probe'
          ! strings full/Toolbox/apps/pgcr/pgcr-screen-probe | grep -E 'screen_set_|screen_create_window|screen_destroy_window'

          cat > full/README-PGCR-FULL-SD-v0.4.1.txt <<'EOF'
          PGCR v0.4.1 COMPLETE SD
          =======================
          Full v0.4 SD package with the P0915 WINDOW_MANAGER probe fix pre-merged.
          Extract all contents directly to an empty FAT32 SD card root.
          EOF

          rm -f PGCR-P0915-FULL-SD-v0.4.1.zip*
          (cd full && zip -r -9 ../PGCR-P0915-FULL-SD-v0.4.1.zip .)
          unzip -t PGCR-P0915-FULL-SD-v0.4.1.zip
          sha256sum PGCR-P0915-FULL-SD-v0.4.1.zip > PGCR-P0915-FULL-SD-v0.4.1.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=pgcr-v0.4.1-full
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PGCR-P0915-FULL-SD-v0.4.1.zip PGCR-P0915-FULL-SD-v0.4.1.zip.sha256 --clobber
          else
            gh release create "$TAG" \
              PGCR-P0915-FULL-SD-v0.4.1.zip \
              PGCR-P0915-FULL-SD-v0.4.1.zip.sha256 \
              --title "PGCR v0.4.1 Full SD" \
              --notes "Complete SD package with P0915 WINDOW_MANAGER probe fix pre-merged and ZIP integrity verified."
          fi
