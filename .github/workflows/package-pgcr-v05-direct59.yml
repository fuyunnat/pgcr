name: Package PGCR v0.5 Direct59 Full SD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/package-pgcr-v05-direct59.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PGCR v0.5 overlay
        uses: actions/checkout@v4
        with:
          ref: dev-crop-zoom-pan
          path: overlay

      - name: Download verified v0.4.1 full SD base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p base
          gh release download pgcr-v0.4.1-full \
            --repo fuyunnat/pgcr \
            --pattern 'PGCR-P0915-FULL-SD-v0.4.1.zip' \
            --dir base
          unzip -t base/PGCR-P0915-FULL-SD-v0.4.1.zip

      - name: Assemble v0.5 full SD
        run: |
          set -e
          rm -rf full
          mkdir full
          unzip -q base/PGCR-P0915-FULL-SD-v0.4.1.zip -d full

          cp overlay/Toolbox/GEM/mqb-pgcrDisplay.esd full/Toolbox/GEM/mqb-pgcrDisplay.esd
          cp overlay/Toolbox/scripts/pgcr_direct59_test.sh full/Toolbox/scripts/pgcr_direct59_test.sh
          chmod +x full/Toolbox/scripts/pgcr_direct59_test.sh

          grep -q 'PGCR v0.5 - Direct CarPlay Source Lab' full/Toolbox/GEM/mqb-pgcrDisplay.esd
          grep -q 'TEST Direct CarPlay source 59 - 15s' full/Toolbox/GEM/mqb-pgcrDisplay.esd
          grep -q 'dmdt.*dc.*90.*59' full/Toolbox/scripts/pgcr_direct59_test.sh || true
          test -f full/metainfo2.txt
          test -f full/Toolbox/apps/pgcr/pgcr-screen-probe
          strings full/Toolbox/apps/pgcr/pgcr-screen-probe | grep 'v0.4.1 CarPlay Source Probe'

          cat > full/README-PGCR-FULL-SD-v0.5.txt <<'EOF'
          PGCR v0.5 COMPLETE SD - Direct CarPlay Source 59 Test
          ======================================================
          Based on the verified v0.4.1 P0915 package.\n          Build profile: direct59-safe-restore.

          New test:
            PGCR Display Lab -> TEST Direct CarPlay source 59 - 15s

          Purpose:
            Temporarily define diagnostic context 90 with stock displayable 59
            (external smartphone / CarPlay source), switch the cockpit to it,
            then automatically restore Audi context 74 after ~18 seconds.

          Preconditions:
            - vehicle parked
            - CarPlay connected
            - Amap visible / CarPlay session active
            - PGCR/MMI Mirror stopped by the test before routing

          This is NOT an AltScreen implementation and does not modify the
          upstream MMI Mirror payload.
          EOF

          rm -f PGCR-P0915-FULL-SD-v0.5-DIRECT59.zip*
          (cd full && zip -r -9 ../PGCR-P0915-FULL-SD-v0.5-DIRECT59.zip .)
          unzip -t PGCR-P0915-FULL-SD-v0.5-DIRECT59.zip
          sha256sum PGCR-P0915-FULL-SD-v0.5-DIRECT59.zip > PGCR-P0915-FULL-SD-v0.5-DIRECT59.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=pgcr-v0.5-direct59
          if gh release view "$TAG" --repo fuyunnat/pgcr >/dev/null 2>&1; then
            gh release upload "$TAG" --repo fuyunnat/pgcr \
              PGCR-P0915-FULL-SD-v0.5-DIRECT59.zip \
              PGCR-P0915-FULL-SD-v0.5-DIRECT59.zip.sha256 --clobber
          else
            gh release create "$TAG" --repo fuyunnat/pgcr \
              PGCR-P0915-FULL-SD-v0.5-DIRECT59.zip \
              PGCR-P0915-FULL-SD-v0.5-DIRECT59.zip.sha256 \
              --title "PGCR v0.5 Direct CarPlay Source 59 Test" \
              --notes "P0915 full SD package. Adds a reversible 15-second diagnostic route from stock smartphone displayable 59 to the Audi cockpit. Auto-restores context 74."
          fi
